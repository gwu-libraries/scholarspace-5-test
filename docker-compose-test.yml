# Requires Docker Compose v2
name: scholarspace-test

x-scholarspace-test-build: &scholarspace-test-build
  dockerfile: Dockerfile
  context: .
  target: scholarspace-default
  args:
    - BUILD_ENV=test
    - BUNDLE_GEMFILE=Gemfile

x-scholarspace-test-worker-environment: &scholarspace-test-worker-environment
  RAILS_ENV: test
  RAILS_ROOT: /app/scholarspace
  HOME: /app/scholarspace
  VALKYRIE_METADATA_ADAPTER: fedora_metadata
  VALKYRIE_STORAGE_ADAPTER: fedora_storage

x-scholarspace-test-worker: &scholarspace-test-worker
  image: scholarspace-worker-test:${RAILS_TAG:-latest}
  build: *scholarspace-test-build
  stop_grace_period: 120s
  user: ${APP_UID:-1001}:${APP_GID:-101}
  env_file:
    - ${COMPOSE_ENV_FILE:-dev.env}
  depends_on:
    app-volumes-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    solr:
      condition: service_healthy
    fedora:
      condition: service_healthy
    fits:
      condition: service_started
    memcached:
      condition: service_started
  volumes:
    - .:/app/scholarspace
    - storage:/app/scholarspace/storage
    - uploads:/app/scholarspace/uploads
    - tmp:/app/scholarspace/tmp
    - bundle-cache:/app/scholarspace/vendor/bundle:ro

services:

  # creates container with dev/test requirements, runs rspec tests, shuts down
  # run via bin/test

  rspec:
    image: scholarspace-rspec:${RAILS_TAG:-latest}
    build: *scholarspace-test-build
    command: sh -c 'bundle check || bundle install; RAILS_ENV=test bundle exec rails db:prepare && RAILS_ENV=test bundle exec rspec'
    user: ${APP_UID:-1001}:${APP_GID:-101}
    env_file:
      - ${COMPOSE_ENV_FILE:-dev.env}
    environment:
      - RAILS_ENV=test
      - RAILS_ROOT=/app/scholarspace
      - HOME=/app/scholarspace # this is needed because alpine (the image we're using), uses HOME
      - VALKYRIE_METADATA_ADAPTER=fedora_metadata
      - VALKYRIE_STORAGE_ADAPTER=fedora_storage
      - HYRAX_DERIVATIVES_PATH=/app/scholarspace/tmp/derivatives
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy
      fedora:
        condition: service_healthy
      fits:
        condition: service_started
      memcached:
        condition: service_started
    volumes:
      - .:/app/scholarspace
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - bundle-cache:/app/scholarspace/vendor/bundle

  worker:
    <<: *scholarspace-test-worker
    command: sh -lc 'exec bundle exec sidekiq -C config/sidekiq.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-test-worker-environment
      SIDEKIQ_WORKER_POOL: default
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_DEFAULT_WORKERS:-1}"

  worker_ingest:
    <<: *scholarspace-test-worker
    command: sh -lc 'exec bundle exec sidekiq -C config/sidekiq/ingest.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-test-worker-environment
      SIDEKIQ_WORKER_POOL: ingest
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_INGEST_WORKERS:-1}"

  worker_whisper:
    <<: *scholarspace-test-worker
    command: sh -lc 'exec bundle exec sidekiq -C config/sidekiq/whisper.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-test-worker-environment
      SIDEKIQ_WORKER_POOL: whisper
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_TRANSCRIPT_WORKERS:-1}"

  worker_ocr_text:
    <<: *scholarspace-test-worker
    command: sh -lc 'exec bundle exec sidekiq -C config/sidekiq/ocr_text.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-test-worker-environment
      SIDEKIQ_WORKER_POOL: ocr_text
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_OCR_TEXT_WORKERS:-1}"

  worker_images:
    <<: *scholarspace-test-worker
    command: sh -lc 'exec bundle exec sidekiq -C config/sidekiq/images.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-test-worker-environment
      SIDEKIQ_WORKER_POOL: images
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_DERIVATIVES_WORKERS:-1}"

  worker_thumbnail:
    <<: *scholarspace-test-worker
    command: sh -lc 'exec bundle exec sidekiq -C config/sidekiq/thumbnail.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-test-worker-environment
      SIDEKIQ_WORKER_POOL: thumbnail
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_THUMBNAIL_WORKERS:-1}"

  worker_persist:
    <<: *scholarspace-test-worker
    command: sh -lc 'exec bundle exec sidekiq -C config/sidekiq/persist.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-test-worker-environment
      SIDEKIQ_WORKER_POOL: persist
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_PERSIST_WORKERS:-1}"

  solr:
    ports:
      - "18983:8983"
    command:
      - sh
      - "-c"
      - "precreate-core scholarspace_test /opt/solr/server/configsets/hyraxconf; solr-precreate scholarspace_test /opt/solr/server/configsets/hyraxconf"

  postgres:
    ports:
      - "15432:5432"

  redis:
    ports:
      - "16379:6379"

  memcached:
    ports:
      - "11212:11211"

  fedora:
    ports:
      - "18080:8080"

  fits:
    ports:
      - "18081:8081"

networks:
  default:
    name: scholarspace-test-net

volumes:
  bundle-cache:
