# Requires Docker Compose v2
name: scholarspace-prod

services:
  rails:
    image: scholarspace-prod:${RAILS_TAG:-latest}
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - BUILD_ENV=prod
        - EXTRA_APK_PACKAGES=less
        - BUNDLE_GEMFILE=Gemfile
        - RAILS_ENV=production
    command: sh -lc 'RAILS_ENV=production bundle exec rails db:prepare && exec bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:3000'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    stdin_open: true
    tty: true
    user: ${APP_UID:-1001}:${APP_GID:-101}
    env_file:
      - .env
    environment:
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=production
      - PUMA_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - solr-ocr-index-cache:/.cache/solr-ocr-index-cache
      - whispercpp-cache:/.cache/whispercpp
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy
      fedora:
        condition: service_healthy
      fits:
        condition: service_started
      memcached:
        condition: service_started
    restart: always

  worker:
    image: scholarspace-worker-prod:${RAILS_TAG:-latest}
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - BUILD_ENV=prod
        - BUNDLE_GEMFILE=Gemfile
        - RAILS_ENV=production
    command: sh -lc 'exec bundle exec sidekiq'
    user: ${APP_UID:-1001}:${APP_GID:-101}
    restart: always
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
    depends_on:
      rails:
        condition: service_healthy
    volumes:
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - solr-ocr-index-cache:/.cache/solr-ocr-index-cache
      - whispercpp-cache:/.cache/whispercpp

  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/ssl
    restart: always
    depends_on:
      rails:
        condition: service_healthy

  fedora:
    ports:
      - "8080:8080"
    environment:
      - >-
        CATALINA_OPTS=-Dfcrepo.home=/fcrepo-home -Djava.awt.headless=true -Dfile.encoding=UTF-8
        -server -Xms1G -Xmx2G -XX:NewSize=256m -XX:MaxNewSize=1G
        -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/mem
        -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true
        -Dfcrepo.pid.minter.length=2 -Dfcrepo.pid.minter.count=4
        -Dfcrepo.jms.enabled=false -Dfcrepo.metrics.enable=true -Dfcrepo.storage=ocfl-s3 -Dfcrepo.aws.region=${AWS_REGION:-us-west-2} -Dfcrepo.ocfl.s3.bucket=${S3_BUCKET_NAME} -Dfcrepo.ocfl.s3.prefix=${S3_PREFIX}

  solr:
    ports:
      - "62821:8983"
    command:
      - sh
      - "-c"
      - "precreate-core scholarspace_test /opt/solr/server/configsets/hyraxconf; solr-precreate scholarspace_prod /opt/solr/server/configsets/hyraxconf"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  memcached:
    ports:
      - "11211:11211"

  fits:
    ports:
      - "8081:8081"

networks:
  default:
    name: scholarspace-prod-net
