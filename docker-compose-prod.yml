# Requires Docker Compose v2
name: scholarspace-prod

services:
  rails:
    image: scholarspace-prod:${RAILS_TAG:-latest}
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - BUILD_ENV=prod
        - EXTRA_APK_PACKAGES=less
        - BUNDLE_GEMFILE=Gemfile
        - RAILS_ENV=production
    command: sh -lc 'RAILS_ENV=production bundle exec rails db:prepare && exec ./bin/rails server -p 3000 -b 0.0.0.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    stdin_open: true
    tty: true
    user: ${APP_UID:-1001}:${APP_GID:-101}
    env_file:
      - .env
    environment:
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=production
      - PUMA_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - ${EFS_OCR_CACHE_MOUNT:-solr-ocr-index-cache}:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp
    cpus: 2.0
    mem_limit: 4g
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy
      fedora:
        condition: service_healthy
      memcached:
        condition: service_started
    restart: always

  worker:
    image: scholarspace-worker-prod:${RAILS_TAG:-latest}
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - BUILD_ENV=prod
        - BUNDLE_GEMFILE=Gemfile
        - RAILS_ENV=production
    command: sh -lc 'exec bundle exec sidekiq'
    user: ${APP_UID:-1001}:${APP_GID:-101}
    restart: always
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
      - SIDEKIQ_ONLY_AUDIO_TRANSCRIPT=false
      - SIDEKIQ_ONLY_PDF_TEXT_EXTRACTION=false
    depends_on:
      rails:
        condition: service_healthy
    volumes:
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - ${EFS_OCR_CACHE_MOUNT:-solr-ocr-index-cache}:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp
    cpus: 1.5
    mem_limit: 3g

  worker_whisper:
    image: scholarspace-worker-prod:${RAILS_TAG:-latest}
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - BUILD_ENV=prod
        - BUNDLE_GEMFILE=Gemfile
        - RAILS_ENV=production
    command: sh -lc 'exec bundle exec sidekiq'
    user: ${APP_UID:-1001}:${APP_GID:-101}
    restart: always
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
      - SIDEKIQ_ONLY_AUDIO_TRANSCRIPT=true
      - SIDEKIQ_ONLY_PDF_TEXT_EXTRACTION=false
      - SIDEKIQ_WORKERS=1
      - MALLOC_ARENA_MAX=2
    depends_on:
      rails:
        condition: service_healthy
      whisper-model-preload:
        condition: service_completed_successfully
    volumes:
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - ${EFS_OCR_CACHE_MOUNT:-solr-ocr-index-cache}:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp
    cpus: 2.0
    mem_limit: 4g

  worker_pdf_text:
    image: scholarspace-worker-prod:${RAILS_TAG:-latest}
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - BUILD_ENV=prod
        - BUNDLE_GEMFILE=Gemfile
        - RAILS_ENV=production
    command: sh -lc 'exec bundle exec sidekiq'
    user: ${APP_UID:-1001}:${APP_GID:-101}
    restart: always
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
      - SIDEKIQ_ONLY_AUDIO_TRANSCRIPT=false
      - SIDEKIQ_ONLY_PDF_TEXT_EXTRACTION=true
      - SIDEKIQ_WORKERS=1
    depends_on:
      rails:
        condition: service_healthy
    volumes:
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - ${EFS_OCR_CACHE_MOUNT:-solr-ocr-index-cache}:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp
    cpus: 1.5
    mem_limit: 3g

  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/ssl
    restart: always
    depends_on:
      rails:
        condition: service_healthy

  fedora:
    ports:
      - "8080:8080"
    environment:
      - >-
        CATALINA_OPTS=-Dfcrepo.home=/fcrepo-home -Djava.awt.headless=true -Dfile.encoding=UTF-8
        -server -Xms1G -Xmx2G -XX:NewSize=256m -XX:MaxNewSize=1G
        -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/mem
        -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true
        -Dfcrepo.pid.minter.length=2 -Dfcrepo.pid.minter.count=4
        -Dfcrepo.jms.enabled=false -Dfcrepo.metrics.enable=true -Dfcrepo.storage=ocfl-s3 -Dfcrepo.aws.region=${AWS_REGION:-us-west-2} -Dfcrepo.ocfl.s3.bucket=${S3_BUCKET_NAME} -Dfcrepo.ocfl.s3.prefix=${S3_PREFIX}

  solr:
    ports:
      - "62821:8983"
    volumes:
      - ${EFS_OCR_CACHE_MOUNT:-solr-ocr-index-cache}:/app/scholarspace/tmp/cache/solr-ocr-index-cache
    command:
      - sh
      - "-c"
      - "precreate-core scholarspace_test /opt/solr/server/configsets/hyraxconf; solr-precreate scholarspace_prod /opt/solr/server/configsets/hyraxconf"

  redis:
    # Bitnami Redis performs startup chmod on internal config paths.
    # Run as root in prod overlay to avoid permission-denied crash loops.
    user: "0:0"
    ports:
      - "6379:6379"

  memcached:
    ports:
      - "11211:11211"

networks:
  default:
    name: scholarspace-prod-net
