# Requires Docker Compose v2
name: scholarspace-dev

x-scholarspace-dev-build: &scholarspace-dev-build
  dockerfile: Dockerfile
  context: .
  target: scholarspace-default
  args:
    - BUILD_ENV=dev
    - BUNDLE_GEMFILE=Gemfile

x-scholarspace-dev-worker-environment: &scholarspace-dev-worker-environment
  HOME: /app/scholarspace
  RAILS_ROOT: /app/scholarspace
  RAILS_ENV: development
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-scholarspace}
  DB_USERNAME: ${POSTGRES_USER:-hyrax_user}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-hyrax_password}

x-scholarspace-dev-worker: &scholarspace-dev-worker
  stdin_open: true
  tty: true
  image: scholarspace-worker:${RAILS_TAG:-latest}
  restart: always
  stop_grace_period: 120s
  user: ${APP_UID:-1001}:${APP_GID:-101}
  env_file:
    - ${COMPOSE_ENV_FILE:-dev.env}
  depends_on:
    app-volumes-init:
      condition: service_completed_successfully
    rails:
      condition: service_healthy
  volumes:
    - .:/app/scholarspace
    - storage:/app/scholarspace/storage
    - uploads:/app/scholarspace/uploads
    - tmp:/app/scholarspace/tmp

services:
  app-volumes-init:
    volumes:
      - node_modules:/app/scholarspace/node_modules

  rails:
    image: scholarspace-worker:${RAILS_TAG:-latest}
    command: sh -lc 'bundle install && yarn install --force && yarn build:dev && bundle exec rails db:create && bundle exec rails db:migrate && bundle exec rails db:seed && rm -f tmp/pids/server.pid && exec ./bin/rails server -p 3000 -b 0.0.0.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    stdin_open: true
    user: ${APP_UID:-1001}:${APP_GID:-101}
    tty: true
    env_file:
      - ${COMPOSE_ENV_FILE:-dev.env}
    environment:
      - HOME=/app/scholarspace
      - XDG_CONFIG_HOME=/app/scholarspace/tmp/cache/yarn/config
      - YARN_GLOBAL_FOLDER=/app/scholarspace/tmp/cache/yarn/global
      - YARN_CACHE_FOLDER=/app/scholarspace/tmp/cache/yarn
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-scholarspace}
      - DB_USERNAME=${POSTGRES_USER:-hyrax_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-hyrax_password}
      - WEBPACKER_DEV_SERVER_HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true # webpacker autorefresh
    ports:
      - "3000:3000"
    volumes:
      - .:/app/scholarspace
      - node_modules:/app/scholarspace/node_modules
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy
      fedora:
        condition: service_healthy
      fits:
        condition: service_started
      memcached:
        condition: service_started

  worker:
    <<: *scholarspace-dev-worker
    build: *scholarspace-dev-build
    command: sh -lc 'bundle install && exec bundle exec sidekiq -C config/sidekiq.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-dev-worker-environment
      SIDEKIQ_WORKER_POOL: default
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_DEFAULT_WORKERS:-}"

  worker_ingest:
    <<: *scholarspace-dev-worker
    command: sh -lc 'bundle install && exec bundle exec sidekiq -C config/sidekiq/ingest.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-dev-worker-environment
      SIDEKIQ_WORKER_POOL: ingest
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_INGEST_WORKERS:-}"

  worker_whisper:
    <<: *scholarspace-dev-worker
    command: sh -lc 'bundle install && exec bundle exec sidekiq -C config/sidekiq/whisper.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-dev-worker-environment
      SIDEKIQ_WORKER_POOL: whisper
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_TRANSCRIPT_WORKERS:-}"

  worker_ocr_text:
    <<: *scholarspace-dev-worker
    command: sh -lc 'bundle install && exec bundle exec sidekiq -C config/sidekiq/ocr_text.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-dev-worker-environment
      SIDEKIQ_WORKER_POOL: ocr_text
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_OCR_TEXT_WORKERS:-}"

  worker_images:
    <<: *scholarspace-dev-worker
    command: sh -lc 'bundle install && exec bundle exec sidekiq -C config/sidekiq/images.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-dev-worker-environment
      SIDEKIQ_WORKER_POOL: images
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_DERIVATIVES_WORKERS:-}"

  worker_thumbnail:
    <<: *scholarspace-dev-worker
    command: sh -lc 'bundle install && exec bundle exec sidekiq -C config/sidekiq/thumbnail.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-dev-worker-environment
      SIDEKIQ_WORKER_POOL: thumbnail
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_THUMBNAIL_WORKERS:-}"

  worker_persist:
    <<: *scholarspace-dev-worker
    command: sh -lc 'bundle install && exec bundle exec sidekiq -C config/sidekiq/persist.yml $${SIDEKIQ_CONCURRENCY:+-c $$SIDEKIQ_CONCURRENCY} -t "${SIDEKIQ_SHUTDOWN_TIMEOUT:-90}"'
    environment:
      <<: *scholarspace-dev-worker-environment
      SIDEKIQ_WORKER_POOL: persist
      SIDEKIQ_CONCURRENCY: "${SIDEKIQ_PERSIST_WORKERS:-}"

  solr:
    ports:
      - "62821:8983"
    command:
      - sh
      - "-c"
      - "precreate-core scholarspace_test /opt/solr/server/configsets/hyraxconf; solr-precreate scholarspace_dev /opt/solr/server/configsets/hyraxconf"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  memcached:
    ports:
      - "11211:11211"

  fedora:
    ports:
      - "8080:8080"

  fits:
    ports:
      - "8081:8081"

volumes:
  node_modules:

networks:
  default:
    name: scholarspace-dev-net
