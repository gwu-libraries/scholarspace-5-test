# Requires Docker Compose v2
name: scholarspace-dev

x-scholarspace-dev-build: &scholarspace-dev-build
  dockerfile: Dockerfile
  context: .
  target: scholarspace-default
  args:
    - BUILD_ENV=dev
    - BUNDLE_GEMFILE=Gemfile

services:
  rails:
    image: scholarspace-rails:${RAILS_TAG:-latest}
    build: *scholarspace-dev-build
    command: sh -lc 'bundle install && yarn install --force && yarn build:dev && bundle exec rails db:create && bundle exec rails db:migrate && bundle exec rails db:seed && exec ./bin/rails server -p 3000 -b 0.0.0.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    stdin_open: true
    user: ${APP_UID:-1001}:${APP_GID:-101}
    tty: true
    env_file:
      - ${COMPOSE_ENV_FILE:-dev.env}
    environment:
      - HOME=/app/scholarspace
      - XDG_CONFIG_HOME=/app/scholarspace/tmp/cache/yarn/config
      - YARN_GLOBAL_FOLDER=/app/scholarspace/tmp/cache/yarn/global
      - YARN_CACHE_FOLDER=/app/scholarspace/tmp/cache/yarn
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-scholarspace}
      - DB_USERNAME=${POSTGRES_USER:-hyrax_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-hyrax_password}
      - WEBPACKER_DEV_SERVER_HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true # webpacker autorefresh
    ports:
      - "3000:3000"
    volumes:
      - .:/app/scholarspace
      - node_modules:/app/scholarspace/node_modules
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - yarn-cache:/app/scholarspace/tmp/cache/yarn
      - solr-ocr-index-cache:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy
      fedora:
        condition: service_healthy
      fits:
        condition: service_started
      memcached:
        condition: service_started

  worker:
    stdin_open: true
    tty: true
    image: scholarspace-worker:${RAILS_TAG:-latest}
    build: *scholarspace-dev-build
    command: sh -lc 'bundle install && exec bundle exec sidekiq -c "${SIDEKIQ_DEFAULT_WORKERS:-4}"'
    restart: always
    user: ${APP_UID:-1001}:${APP_GID:-101}
    env_file:
      - ${COMPOSE_ENV_FILE:-dev.env}
    environment:
      - HOME=/app/scholarspace
      - XDG_CONFIG_HOME=/app/scholarspace/tmp/cache/yarn/config
      - YARN_GLOBAL_FOLDER=/app/scholarspace/tmp/cache/yarn/global
      - YARN_CACHE_FOLDER=/app/scholarspace/tmp/cache/yarn
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-scholarspace}
      - DB_USERNAME=${POSTGRES_USER:-hyrax_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-hyrax_password}
      - SIDEKIQ_ONLY_AUDIO_TRANSCRIPT=false
      - SIDEKIQ_ONLY_OCR_TEXT_EXTRACTION=false
      - SIDEKIQ_ONLY_DERIVATIVES=false
      - SIDEKIQ_ONLY_THUMBNAIL=false
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      rails:
        condition: service_healthy
    volumes:
      - .:/app/scholarspace
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - yarn-cache:/app/scholarspace/tmp/cache/yarn
      - solr-ocr-index-cache:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp

  worker_whisper:
    stdin_open: true
    tty: true
    image: scholarspace-worker:${RAILS_TAG:-latest}
    build: *scholarspace-dev-build
    command: sh -lc 'bundle install && exec bundle exec sidekiq -c "${SIDEKIQ_TRANSCRIPT_WORKERS:-1}"'
    restart: always
    user: ${APP_UID:-1001}:${APP_GID:-101}
    env_file:
      - ${COMPOSE_ENV_FILE:-dev.env}
    environment:
      - HOME=/app/scholarspace
      - XDG_CONFIG_HOME=/app/scholarspace/tmp/cache/yarn/config
      - YARN_GLOBAL_FOLDER=/app/scholarspace/tmp/cache/yarn/global
      - YARN_CACHE_FOLDER=/app/scholarspace/tmp/cache/yarn
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-scholarspace}
      - DB_USERNAME=${POSTGRES_USER:-hyrax_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-hyrax_password}
      - SIDEKIQ_ONLY_AUDIO_TRANSCRIPT=true
      - SIDEKIQ_ONLY_OCR_TEXT_EXTRACTION=false
      - SIDEKIQ_ONLY_DERIVATIVES=false
      - SIDEKIQ_ONLY_THUMBNAIL=false
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      rails:
        condition: service_healthy
    volumes:
      - .:/app/scholarspace
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - yarn-cache:/app/scholarspace/tmp/cache/yarn
      - solr-ocr-index-cache:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp

  worker_ocr_text:
    stdin_open: true
    tty: true
    image: scholarspace-worker:${RAILS_TAG:-latest}
    build: *scholarspace-dev-build
    command: sh -lc 'bundle install && exec bundle exec sidekiq -c "${SIDEKIQ_OCR_TEXT_WORKERS:-1}"'
    restart: always
    user: ${APP_UID:-1001}:${APP_GID:-101}
    env_file:
      - ${COMPOSE_ENV_FILE:-dev.env}
    environment:
      - HOME=/app/scholarspace
      - XDG_CONFIG_HOME=/app/scholarspace/tmp/cache/yarn/config
      - YARN_GLOBAL_FOLDER=/app/scholarspace/tmp/cache/yarn/global
      - YARN_CACHE_FOLDER=/app/scholarspace/tmp/cache/yarn
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-scholarspace}
      - DB_USERNAME=${POSTGRES_USER:-hyrax_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-hyrax_password}
      - SIDEKIQ_ONLY_AUDIO_TRANSCRIPT=false
      - SIDEKIQ_ONLY_OCR_TEXT_EXTRACTION=true
      - SIDEKIQ_ONLY_DERIVATIVES=false
      - SIDEKIQ_ONLY_THUMBNAIL=false
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      rails:
        condition: service_healthy
    volumes:
      - .:/app/scholarspace
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - yarn-cache:/app/scholarspace/tmp/cache/yarn
      - solr-ocr-index-cache:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp

  worker_images:
    stdin_open: true
    tty: true
    image: scholarspace-worker:${RAILS_TAG:-latest}
    build: *scholarspace-dev-build
    command: sh -lc 'bundle install && exec bundle exec sidekiq -c "${SIDEKIQ_DERIVATIVES_WORKERS:-2}"'
    restart: always
    user: ${APP_UID:-1001}:${APP_GID:-101}
    env_file:
      - ${COMPOSE_ENV_FILE:-dev.env}
    environment:
      - HOME=/app/scholarspace
      - XDG_CONFIG_HOME=/app/scholarspace/tmp/cache/yarn/config
      - YARN_GLOBAL_FOLDER=/app/scholarspace/tmp/cache/yarn/global
      - YARN_CACHE_FOLDER=/app/scholarspace/tmp/cache/yarn
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-scholarspace}
      - DB_USERNAME=${POSTGRES_USER:-hyrax_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-hyrax_password}
      - SIDEKIQ_ONLY_AUDIO_TRANSCRIPT=false
      - SIDEKIQ_ONLY_OCR_TEXT_EXTRACTION=false
      - SIDEKIQ_ONLY_DERIVATIVES=true
      - SIDEKIQ_ONLY_THUMBNAIL=false
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      rails:
        condition: service_healthy
    volumes:
      - .:/app/scholarspace
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - yarn-cache:/app/scholarspace/tmp/cache/yarn
      - solr-ocr-index-cache:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp

  worker_thumbnail:
    stdin_open: true
    tty: true
    image: scholarspace-worker:${RAILS_TAG:-latest}
    build: *scholarspace-dev-build
    command: sh -lc 'bundle install && exec bundle exec sidekiq -c "${SIDEKIQ_THUMBNAIL_WORKERS:-2}"'
    restart: always
    user: ${APP_UID:-1001}:${APP_GID:-101}
    env_file:
      - ${COMPOSE_ENV_FILE:-dev.env}
    environment:
      - HOME=/app/scholarspace
      - XDG_CONFIG_HOME=/app/scholarspace/tmp/cache/yarn/config
      - YARN_GLOBAL_FOLDER=/app/scholarspace/tmp/cache/yarn/global
      - YARN_CACHE_FOLDER=/app/scholarspace/tmp/cache/yarn
      - RAILS_ROOT=/app/scholarspace
      - RAILS_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-scholarspace}
      - DB_USERNAME=${POSTGRES_USER:-hyrax_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-hyrax_password}
      - SIDEKIQ_ONLY_AUDIO_TRANSCRIPT=false
      - SIDEKIQ_ONLY_OCR_TEXT_EXTRACTION=false
      - SIDEKIQ_ONLY_DERIVATIVES=false
      - SIDEKIQ_ONLY_THUMBNAIL=true
    depends_on:
      app-volumes-init:
        condition: service_completed_successfully
      rails:
        condition: service_healthy
    volumes:
      - .:/app/scholarspace
      - storage:/app/scholarspace/storage
      - uploads:/app/scholarspace/uploads
      - tmp:/app/scholarspace/tmp
      - yarn-cache:/app/scholarspace/tmp/cache/yarn
      - solr-ocr-index-cache:/app/scholarspace/tmp/cache/solr-ocr-index-cache
      - derivatives-cache:/app/scholarspace/tmp/cache/derivatives
      - whispercpp-cache:/app/scholarspace/tmp/cache/whispercpp

  solr:
    ports:
      - "62821:8983"
    command:
      - sh
      - "-c"
      - "precreate-core scholarspace_test /opt/solr/server/configsets/hyraxconf; solr-precreate scholarspace_dev /opt/solr/server/configsets/hyraxconf"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  memcached:
    ports:
      - "11211:11211"

  fedora:
    ports:
      - "8080:8080"

  fits:
    ports:
      - "8081:8081"

volumes:
  node_modules:
  yarn-cache:

networks:
  default:
    name: scholarspace-dev-net
