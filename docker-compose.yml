# Requires Docker Compose v2
name: ${COMPOSE_PROJECT_NAME:-scholarspace}

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: db
        target: /var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: bitnami/redis:latest
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - type: volume
        source: redis
        target: /bitnami/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: always

  memcached:
    image: bitnami/memcached
    ports:
      - "11211:11211"
    restart: always

  fedora:
    image: fcrepo/fcrepo:6.5.1-tomcat9
    restart: always
    ports:
      - "8080:8080"
    environment:
      - >-
        CATALINA_OPTS=-Dfcrepo.home=/fcrepo-home -Djava.awt.headless=true -Dfile.encoding=UTF-8
        -server -Xms1G -Xmx2G -XX:NewSize=256m -XX:MaxNewSize=1G
        -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/mem
        -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true
        -Dfcrepo.pid.minter.length=2 -Dfcrepo.pid.minter.count=4
        -Dfcrepo.jms.enabled=false -Dfcrepo.metrics.enable=true
        -Dfcrepo.db.url=jdbc:h2:/fcrepo-home/data/fcrepo-h2\;FILE_LOCK=FILE
      - JAVA_OPTS=-Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true -Dfcrepo.pid.minter.length=2 -Dfcrepo.pid.minter.count=4
    volumes:
      - type: volume
        source: fedora
        target: /fcrepo-home
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet --http-user=fedoraAdmin --http-password=fedoraAdmin http://localhost:8080/fcrepo/rest || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 40s

  fits:
    build:
      dockerfile: Dockerfile-fits
      context: .
    ports:
      - "8081:8081"
    restart: always

  solr:
    image: solr:8.11
    user: 8983:8983
    ports:
      - "62821:8983"
    command:
      - sh
      - "-c"
      - "precreate-core scholarspace_test /opt/solr/server/configsets/hyraxconf; solr-precreate scholarspace_dev /opt/solr/server/configsets/hyraxconf"
    volumes:
      - type: volume
        source: solr_home
        target: /var/solr/data
        consistency: cached
      - ./solr/conf:/opt/solr/server/configsets/hyraxconf
      - ./solr/plugins:/opt/solr/contrib/plugins
      - type: volume
        source: solr-ocr-index-cache
        target: /.cache/solr-ocr-index-cache
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 localhost:8983 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20
    restart: always

volumes:
  db:
  storage:
  uploads:
  public:
  tmp:
  redis:
  fedora:
  solr_home:
  solr-ocr-index-cache:
  whispercpp-cache:
